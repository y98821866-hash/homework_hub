<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework Hub</title>
  <style>
    :root {
      --primary: #7C3AED;
      --primary-light: #DDD6FE;
      --primary-bg: #F5F3FF;
      --card-bg: #FFFFFF;
      --text-dark: #1F2937;
      --text-muted: #6B7280;
      --border-color: #E5E7EB;
      --badge-bg: #EEF2FF;
      --badge-text: #4F46E5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #F3F0FF 0%, #FAFAFA 100%);
      color: var(--text-dark);
      padding: 16px;
      padding-bottom: 100px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* Header Title */
    .header-banner {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      word-break: break-all;
    }

    .app-title-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .app-title-dot {
      width: 10px;
      height: 10px;
      background-color: var(--primary);
      border-radius: 50%;
    }

    .app-title {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
    }

    /* User Profile Bar */
    .user-profile-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 12px;
    }

    .name-input-wrapper {
      position: relative;
      flex: 1;
    }

    .name-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: 600;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      background: #FFFFFF;
      transition: all 0.2s;
    }

    .name-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }

    .score-badge {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
      white-space: nowrap;
    }

    /* Main Section Cards */
    .section-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(229, 231, 235, 0.6);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-subtext {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Homework Empty Box */
    .homework-empty {
      border: 2px dashed #E5E7EB;
      border-radius: 16px;
      padding: 32px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .homework-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .homework-item {
      background: #F9FAFB;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .hw-subject {
      display: inline-block;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
    }

    .hw-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .hw-meta {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .hw-author {
      font-size: 11px;
      color: var(--primary);
      margin-top: 4px;
      font-weight: 500;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #EF4444;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    /* Leaderboard Component */
    .reset-timer-box {
      background: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 100%);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }

    .reset-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #6D28D9;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .reset-countdown {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .reset-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F9FAFB;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      border: 1px solid #F3F4F6;
    }

    .leaderboard-item.is-me {
      background: var(--primary-bg);
      border-color: var(--primary-light);
    }

    .user-info-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .rank-icon {
      font-size: 16px;
    }

    .user-score {
      font-weight: 700;
      color: var(--primary);
    }

    /* Floating Add Button */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: calc(50% - 220px + 16px);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: white;
      border: none;
      font-size: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
      cursor: pointer;
      z-index: 100;
      transition: transform 0.2s;
    }

    @media (max-width: 480px) {
      .fab-btn {
        right: 20px;
      }
    }

    .fab-btn:active {
      transform: scale(0.92);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-dark);
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
    }
  </style>
</head>
<body>

  <div class="header-banner"># Homework-website-v2 For Class 3A CSS 2026-2027 version 2</div>

  <!-- Header Title -->
  <div class="app-title-container">
    <div class="app-title-dot"></div>
    <div class="app-title">Homework Hub</div>
  </div>

  <!-- User Info & Score Bar -->
  <div class="user-profile-bar">
    <div class="name-input-wrapper">
      <input type="text" id="userNameInput" class="name-input" value="Test" placeholder="输入你的名字">
    </div>
    <div class="score-badge">
      <span>⭐</span>
      <span id="userPts">0 pts</span>
    </div>
  </div>

  <!-- Homework Section -->
  <div class="section-card">
    <div class="section-header">
      <div class="section-title">📋 Homework</div>
      <div class="section-subtext">Sorted by due date → subject</div>
    </div>
    <div id="homeworkContainer">
      <div class="homework-empty">
        No homework yet.<br>
        Tap the <b>+</b> button to add your first assignment 🎉
      </div>
    </div>
  </div>

  <!-- Leaderboard Section -->
  <div class="section-card">
    <div class="section-header">
      <div class="section-title">🏆 Leaderboard</div>
      <div class="section-subtext" id="currentMonthText">2026年10月</div>
    </div>

    <div class="reset-timer-box">
      <div class="reset-label">Resets In</div>
      <div class="reset-countdown" id="countdownDisplay">00d 00h 00m 00s</div>
      <div class="reset-date" id="resetDateText">Resets on 2026年11月1日 · 12:00 AM</div>
    </div>

    <div class="leaderboard-list" id="leaderboardList">
      <!-- Leaderboard users dynamically injected here -->
    </div>
  </div>

  <!-- Floating Add Button -->
  <button class="fab-btn" id="openModalBtn">+</button>

  <!-- Add Homework Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">上载新功课 (+10 pts)</div>
        <button class="close-btn" id="closeModalBtn">✕</button>
      </div>
      <form id="addHomeworkForm">
        <div class="form-group">
          <label class="form-label">科目 (Subject)</label>
          <input type="text" class="form-input" id="hwSubject" placeholder="例: English / 中文 / Physics" required>
        </div>
        <div class="form-group">
          <label class="form-label">功课内容 (Assignment)</label>
          <input type="text" class="form-input" id="hwTitle" placeholder="例: Chapter 3 Worksheet" required>
        </div>
        <div class="form-group">
          <label class="form-label">截止日期 (Due Date)</label>
          <input type="date" class="form-input" id="hwDueDate" required>
        </div>
        <button type="submit" class="submit-btn">立即发布上载</button>
      </form>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyForPublicHomeworkHubApp2026",
      authDomain: "homework-hub-3a.firebaseapp.com",
      projectId: "homework-hub-3a",
      storageBucket: "homework-hub-3a.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Device ID Management (Ensure distinct accounts across browsers/devices)
    let deviceId = localStorage.getItem('hw_hub_device_id');
    if (!deviceId) {
      deviceId = 'user_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('hw_hub_device_id', deviceId);
    }

    let myName = localStorage.getItem('hw_hub_user_name') || 'Test';
    const nameInput = document.getElementById('userNameInput');
    nameInput.value = myName;

    // Save Name locally and sync
    nameInput.addEventListener('change', (e) => {
      myName = e.target.value.trim() || 'Test';
      localStorage.setItem('hw_hub_user_name', myName);
      updateUserScoreInCloud();
    });

    let allHomeworks = [];
    let allUsers = [];

    // 2. Realtime Listener for Homeworks
    onSnapshot(collection(db, "homeworks"), (snapshot) => {
      allHomeworks = [];
      snapshot.forEach((doc) => {
        allHomeworks.push({ id: doc.id, ...doc.data() });
      });

      // Strict Sorting: Primary by Due Date (Earliest first), Secondary by Subject
      allHomeworks.sort((a, b) => {
        const dateA = a.dueDate ? new Date(a.dueDate) : new Date('9999-12-31');
        const dateB = b.dueDate ? new Date(b.dueDate) : new Date('9999-12-31');
        
        if (dateA - dateB !== 0) {
          return dateA - dateB; // 截止日期越早越靠前
        }

        // 同一天截止按科目名称排序
        const subA = (a.subject || '').toLowerCase();
        const subB = (b.subject || '').toLowerCase();
        return subA.localeCompare(subB, 'zh-Hant');
      });

      renderHomeworks();
      calculateAndUpdateScores();
    });

    // 3. Realtime Listener for Users (Leaderboard)
    onSnapshot(collection(db, "users"), (snapshot) => {
      allUsers = [];
      snapshot.forEach((doc) => {
        allUsers.push({ id: doc.id, ...doc.data() });
      });

      renderLeaderboard();
    });

    // Calculate user scores strictly by total uploaded homeworks (10 pts per upload)
    function calculateAndUpdateScores() {
      const myUploadCount = allHomeworks.filter(hw => hw.authorId === deviceId).length;
      const myPts = myUploadCount * 10;
      
      document.getElementById('userPts').innerText = `${myPts} pts`;
      updateUserScoreInCloud(myPts);
    }

    async function updateUserScoreInCloud(score) {
      const currentPts = score !== undefined ? score : (allHomeworks.filter(hw => hw.authorId === deviceId).length * 10);
      try {
        await setDoc(doc(db, "users", deviceId), {
          name: myName,
          pts: currentPts,
          updatedAt: serverTimestamp()
        }, { merge: true });
      } catch (err) {
        console.error("Score sync error", err);
      }
    }

    // Render Homework List
    function renderHomeworks() {
      const container = document.getElementById('homeworkContainer');
      if (allHomeworks.length === 0) {
        container.innerHTML = `
          <div class="homework-empty">
            No homework yet.<br>
            Tap the <b>+</b> button to add your first assignment 🎉
          </div>`;
        return;
      }

      container.innerHTML = `<div class="homework-list">` + 
        allHomeworks.map(hw => `
          <div class="homework-item">
            <div>
              <span class="hw-subject">${escapeHtml(hw.subject)}</span>
              <div class="hw-title">${escapeHtml(hw.title)}</div>
              <div class="hw-meta">📅 截止: ${hw.dueDate || '未设定'}</div>
              <div class="hw-author">👤 由 ${escapeHtml(hw.authorName)} 上载</div>
            </div>
            ${hw.authorId === deviceId ? `
              <button class="delete-btn" onclick="deleteHomework('${hw.id}')">🗑️</button>
            ` : ''}
          </div>
        `).join('') + `</div>`;
    }

    // Render Leaderboard List
    function renderLeaderboard() {
      const listEl = document.getElementById('leaderboardList');
      
      // Sort users by points descending
      const sortedUsers = [...allUsers].sort((a, b) => (b.pts || 0) - (a.pts || 0));

      if (sortedUsers.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; color:#9CA3AF; font-size:13px;">暂无排行榜数据</div>`;
        return;
      }

      listEl.innerHTML = sortedUsers.map((u, idx) => {
        const isMe = u.id === deviceId;
        let rankIcon = '🥇';
        if (idx === 1) rankIcon = '🥈';
        else if (idx === 2) rankIcon = '🥉';
        else if (idx > 2) rankIcon = `#${idx + 1}`;

        return `
          <div class="leaderboard-item ${isMe ? 'is-me' : ''}">
            <div class="user-info-left">
              <span class="rank-icon">${rankIcon}</span>
              <span>${escapeHtml(u.name || 'Test')} ${isMe ? '(你)' : ''}</span>
            </div>
            <div class="user-score">${u.pts || 0}</div>
          </div>
        `;
      }).join('');
    }

    // Add Homework Submit Handler
    document.getElementById('addHomeworkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const subject = document.getElementById('hwSubject').value.trim();
      const title = document.getElementById('hwTitle').value.trim();
      const dueDate = document.getElementById('hwDueDate').value;

      if (!subject || !title) return;

      const newDocRef = doc(collection(db, "homeworks"));
      await setDoc(newDocRef, {
        subject,
        title,
        dueDate,
        authorId: deviceId,
        authorName: myName,
        createdAt: serverTimestamp()
      });

      // Reset & Close Modal
      document.getElementById('addHomeworkForm').reset();
      closeModal();
    });

    // Global Delete Homework Function
    window.deleteHomework = async (id) => {
      if (confirm('确定要删除这篇功课吗？删除后对应上载的 10 积分将被扣回。')) {
        await deleteDoc(doc(db, "homeworks", id));
      }
    };

    // Modal Control
    const modalOverlay = document.getElementById('modalOverlay');
    document.getElementById('openModalBtn').addEventListener('click', () => {
      modalOverlay.classList.add('active');
    });
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    // Utilities
    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Countdown Timer System
    function updateTimer() {
      const now = new Date();
      
      // Update Month title
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      document.getElementById('currentMonthText').innerText = `${year}年${month}月`;

      // Calculate Next Month First Day 00:00:00
      const nextMonth = new Date(year, now.getMonth() + 1, 1, 0, 0, 0);
      document.getElementById('resetDateText').innerText = `Resets on ${nextMonth.getFullYear()}年${nextMonth.getMonth() + 1}月1日 · 12:00 AM`;

      const diff = nextMonth - now;
      if (diff <= 0) {
        document.getElementById('countdownDisplay').innerText = "00d 00h 00m 00s";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      const pad = (n) => n.toString().padStart(2, '0');
      document.getElementById('countdownDisplay').innerText = 
        `${pad(days)}d ${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
